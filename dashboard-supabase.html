<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#faf9f5">
  <script>
    // Aplica el tema antes de pintar para que no parpadee al abrir la app
    (function () {
      var t = 'clasico', m = null;
      try { t = localStorage.getItem('tareas_theme') || 'clasico'; m = localStorage.getItem('tareas_mode_' + t); } catch (e) {}
      if (['clasico', 'calma', 'papel', 'foco'].indexOf(t) < 0) t = 'clasico';
      if (!m) m = t === 'foco' ? 'dark' : 'auto';
      var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tareas">
  <title>Tareas</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='4' fill='%23faf9f5' stroke='%23D97757' stroke-width='2'/%3E%3Crect x='8' y='0' width='16' height='5' rx='2.5' fill='%23D97757'/%3E%3Cpath d='M9 13l3 3 5-5' fill='none' stroke='%23D97757' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='20' y='12' width='5' height='2' rx='1' fill='%23c4c4c2'/%3E%3Crect x='9' y='20' width='10' height='2' rx='1' fill='%23c4c4c2'/%3E%3Crect x='9' y='25' width='7' height='2' rx='1' fill='%23c4c4c2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="app.css?v=11">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>

  <div id="loginScreen" class="login-screen" hidden>
    <form class="login-box" id="loginForm">
      <h2>Tareas</h2>
      <p>Inicia sesión para ver tu planificador</p>
      <label>Email
        <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email" required>
      </label>
      <label>Contraseña
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
      </label>
      <button class="btn primary" id="loginBtn" type="submit">Entrar</button>
      <div class="login-error" id="loginError" hidden>Email o contraseña incorrectos</div>
    </form>
  </div>

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">Hoy</h1>
        <div class="view-sub" id="viewSub"></div>
      </div>
      <div class="topbar-right">
        <div class="save-state" id="saveState"><span class="dot"></span><span id="saveText">Guardado</span></div>
        <div id="viewActions"></div>
      </div>
    </header>
    <div class="banner" id="schemaBanner" hidden></div>
    <div class="view" id="view">
      <div class="skeleton" aria-label="Cargando tareas"><div style="--w: 46%"></div><div style="--w: 32%"></div><div style="--w: 54%"></div><div style="--w: 38%"></div><div style="--w: 44%"></div></div>
    </div>
  </main>

  <nav class="bottomnav" id="bottomnav"></nav>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" hidden></aside>
  <div class="modal-wrap" id="modalWrap" hidden></div>
  <div class="toast" id="toast"></div>

  <script src="app.js?v=11"></script>
</body>

</html>
